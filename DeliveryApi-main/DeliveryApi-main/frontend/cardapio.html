<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery - Cardápio</title>
    <link rel="icon" type="image/png" href="imagens/logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topo">
    <a href="index.html" class="logo">
        <img src="imagens/logo.png" alt="Delivery">
    </a>

    <nav>
        <a href="index.html">Início</a>
        <a href="cardapio.html">Cardápio</a>
        <a href="clientes.html">Clientes</a>
        <a href="entregadores.html">Entregadores</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="relatorios.html">Relatórios</a>
    </nav>
</header>

<main class="container">

    <section class="pagina-cabecalho">
        <h1>Cardápio</h1>
        <p>Cadastre e consulte os itens disponíveis no cardápio.</p>
    </section>

    <section class="barra-acoes">

        <div class="busca">
            <input
                type="text"
                id="buscaCardapio"
                placeholder="Digite o nome do item..."
            >

            <button id="btnBuscar">
                Buscar
            </button>
        </div>

        <button id="btnListar">
            Listar todos
        </button>

        <button id="btnNovoItem">
            Adicionar item
        </button>

    </section>

    <section id="formularioItem" class="formulario oculto">

        <h2>Adicionar item ao cardápio</h2>

        <form id="formItem">

            <div class="campo">
                <label for="tipoItem">Tipo</label>

                <select id="tipoItem" required>
                    <option value="">Selecione</option>
                    <option value="prato">Prato</option>
                    <option value="bebida">Bebida</option>
                    <option value="sobremesa">Sobremesa</option>
                </select>
            </div>

            <div class="campo">
                <label for="nomeItem">Nome</label>

                <input
                    type="text"
                    id="nomeItem"
                    placeholder="Nome do item"
                    minlength="2"
                    maxlength="100"
                    required
                >
            </div>

            <div class="campo">
                <label for="precoItem">Preço</label>

                <input
                    type="number"
                    id="precoItem"
                    min="0.01"
                    step="0.01"
                    placeholder="0,00"
                    required
                >
            </div>

            <div id="campoPrato" class="campo oculto">
                <label for="tempoPreparo">
                    Tempo de preparo (minutos)
                </label>

                <input
                    type="number"
                    id="tempoPreparo"
                    min="1"
                    placeholder="Ex.: 30"
                >
            </div>

            <div id="campoBebida" class="campo oculto">
                <label for="volumeBebida">
                    Volume (ml)
                </label>

                <input
                    type="number"
                    id="volumeBebida"
                    min="1"
                    placeholder="Ex.: 350"
                >
            </div>

            <div id="campoSobremesa" class="campo oculto">
                <label for="refrigerada">
                    É gelada?
                </label>

                <select id="refrigerada">
                    <option value="false">Não</option>
                    <option value="true">Sim</option>
                </select>
            </div>

            <div class="botoes-formulario">

                <button type="submit">
                    Salvar item
                </button>

                <button
                    type="button"
                    id="btnCancelarItem"
                >
                    Cancelar
                </button>

            </div>

        </form>

    </section>

    <section class="tabela-container">

        <h2>Itens cadastrados</h2>

        <table>

            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Preço</th>
                </tr>
            </thead>

            <tbody id="tabelaCardapio">
                <tr>
                    <td colspan="4">
                        Nenhum item encontrado.
                    </td>
                </tr>
            </tbody>

        </table>

    </section>

</main>

<footer>
    Sistema de Gerenciamento de Delivery
</footer>

<script src="js/api.js"></script>
<script src="js/cardapio.js"></script>

</body>
</html>
